# =========================================================================
# WORKFLOW: The entire file itself represents the Workflow.
# It defines the complete automation blueprint from code push to deployment.
# =========================================================================
name: Production PHP CI-CD Pipeline

# -------------------------------------------------------------------------
# TRIGGER: The "on" block defines what GitHub event starts this workflow.
# -------------------------------------------------------------------------
on:
  push:
    branches: [ "main" ] # Triggers the workflow when code is pushed to main
  pull_request:
    branches: [ "main" ] # Triggers validation when a pull request is opened against main

# -------------------------------------------------------------------------
# JOBS: The major execution phases. 
# Each job runs concurrently in its own clean virtual machine runner.
# -------------------------------------------------------------------------
jobs:

  # JOB: Simple Deployment Phase
  deploy-to-server:
    runs-on: ubuntu-latest

    # TASKS / STEPS: Sequential items executed step-by-step.
    steps:
      
      # ACTION: Pulls down your simple PHP file onto the GitHub runner.
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      # ACTION: Connects securely to your server and pulls the changes.
      - name: Execute Remote SSH Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          username: ${{secrets.USER_NAME}} # <-- Double check if your server user is ubuntu, root, or something else
          
          # TASK: Commands executed directly inside your remote server terminal
          script: |
            cd /var/www/html/alihadeed/
            git pull origin main
            echo "Successfully pulled the latest PHP file!"
